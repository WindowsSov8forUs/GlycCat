# 配置文件
# 请根据注释进行配置，未填写的可选项使用默认值

# 日志等级
# 0：关闭；1：致命错误；2：错误；3：警告；4：信息；5：调试；6/7：所有日志
log_level: 4

account: # QQ 机器人配置
  bot_id: 0 # 兼容旧配置；实际账号身份由 QQ 开放平台返回
  app_id: 0 # 机器人 ID
  token: "" # 兼容旧配置；新版 SDK 不再使用此字段
  app_secret: "" # 机器人密钥
  sandbox: false # 是否使用沙箱环境

  websocket:
    enable: false # 是否启用 WebSocket，与 WebHook 二选一
    shards: 0 # 兼容旧分片数量；新配置使用自动分片
    intents: [] # 留空时使用 SDK 默认订阅；填写时保留完整订阅名称

  webhook:
    enable: true # 是否启用 QQ 开放平台回调
    host: "" # 留空时沿用 Satori 监听地址
    port: 0 # 0 表示沿用 Satori 端口；这里监听 HTTP，HTTPS 由反向代理提供
    path: "/qqbot" # QQ 开放平台回调路径

# 兼容旧文件服务器配置，普通媒体上传使用 SDK，不需要公网文件服务器
file_server:
  enable: false
  external_url: ""
  ttl: 0 # 旧文件有效期，单位秒，0 表示不自动过期

database:
  message_database:
    enable: true # 是否保存已接收的群聊和私聊消息
    limit: 50 # 每次查询的数量上限，0 表示不额外限制

satori: # Satori 配置
  version: 1 # 目前只支持 Satori v1
  path: "" # 部署路径，可以为空
  token: "" # 独立的 Satori API 鉴权令牌

  server:
    host: "127.0.0.1" # 服务器监听地址
    port: 5140 # 服务器端口

  webhook:
    timeout: 10 # 反向事件推送超时，单位秒；0 使用 SDK 默认值
