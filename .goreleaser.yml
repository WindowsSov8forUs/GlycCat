# .goreleaser.yml
version: 2

before:
  hooks:
    - go mod verify
    - go vet ./...

release:
  prerelease: auto

builds:
  - id: nowin
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
      - GOWORK=off
      - GOTOOLCHAIN=local
      - GOFLAGS=-mod=readonly
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/WindowsSov8forUs/glyccat/version.Version={{ .Version }}
  - id: win
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
      - GOWORK=off
      - GOTOOLCHAIN=local
      - GOFLAGS=-mod=readonly
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/WindowsSov8forUs/glyccat/version.Version={{ .Version }}

archives:
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  - id: archive
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

# checksum:
#   name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
